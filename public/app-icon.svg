<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144">
  <defs>
    <linearGradient id="wealthGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1eb589" />
      <stop offset="50%" stop-color="#149c77" />
      <stop offset="100%" stop-color="#076d54" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="144" height="144" rx="36" fill="url(#wealthGrad)" />
  <!-- Growth trend chart line -->
  <path d="M 40 92 L 62 58 L 82 82 L 104 46" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#softGlow)" />
  <!-- Terminal indicator dot -->
  <circle cx="104" cy="46" r="6.5" fill="#ffffff" />
  <!-- Baseline support line -->
  <line x1="46" y1="104" x2="98" y2="104" 
        stroke="#ffffff" 
        stroke-opacity="0.45" 
        stroke-width="6" 
        stroke-linecap="round" />
</svg>
